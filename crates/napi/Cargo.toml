[package]
name = "open-zipper-napi"
description = "Node-API bindings for OpenZipper via the WAE facade"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
name = "open_zipper_napi"

[dependencies]
open-zipper-core.workspace = true
serde.workspace = true
serde_json.workspace = true
wae.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
