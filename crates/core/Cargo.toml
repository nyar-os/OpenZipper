[package]
name = "open-zipper-core"
description = "Archive engine for OpenZipper: formats, path safety, bomb limits and streaming IO"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acorn-codec = { workspace = true }
acorn-core = { workspace = true }
acorn-source = { workspace = true }
acorn-tar = { workspace = true }
acorn-zip = { workspace = true }
bzip2 = "0.6"
encoding_rs = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd", "util"] }
xz2 = { version = "0.1", features = ["static"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "lz4", "ppmd", "util"] }
