[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
exclude = ["projects"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nyar-os/OpenZipper"

[workspace.dependencies]
acorn-codec = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "ba97e361c1ed94aae35bdf4bb94e35d4443d0765" }
acorn-core = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "ba97e361c1ed94aae35bdf4bb94e35d4443d0765" }
acorn-source = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "ba97e361c1ed94aae35bdf4bb94e35d4443d0765" }
acorn-tar = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "ba97e361c1ed94aae35bdf4bb94e35d4443d0765" }
acorn-zip = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "ba97e361c1ed94aae35bdf4bb94e35d4443d0765" }
open-zipper-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "aebaade72c695c2d9fcd583439f4fbf832ba3c6d" }

[profile.release]
lto = true
panic = "abort"
