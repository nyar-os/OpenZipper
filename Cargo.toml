[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
exclude = ["projects"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nyar-os/OpenZipper"

[workspace.dependencies]
boost-source = { git = "https://github.com/oovm/rust-boost", rev = "37fee59efe65e8767f99dc0039a92fd797cedcb8" }
data-binary-core = { git = "https://github.com/oovm/rust-boost", rev = "37fee59efe65e8767f99dc0039a92fd797cedcb8" }
data-binary-tar = { git = "https://github.com/oovm/rust-boost", rev = "37fee59efe65e8767f99dc0039a92fd797cedcb8" }
data-binary-zip = { git = "https://github.com/oovm/rust-boost", rev = "37fee59efe65e8767f99dc0039a92fd797cedcb8" }
data-compression = { git = "https://github.com/oovm/rust-boost", rev = "37fee59efe65e8767f99dc0039a92fd797cedcb8" }
open-zipper-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "836b4b0441c01c761686f3f0a4856e3e98b80423" }

[profile.release]
lto = true
panic = "abort"
