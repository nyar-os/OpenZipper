[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
exclude = ["projects"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nyar-os/OpenZipper"

[workspace.dependencies]
open-zipper-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
panic = "abort"
