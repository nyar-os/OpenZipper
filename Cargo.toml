[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
exclude = ["projects"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nyar-os/OpenZipper"

[workspace.dependencies]
acorn-codec = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "0607e54340f34c65370576c49cc5c4cceee4fb87" }
acorn-core = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "0607e54340f34c65370576c49cc5c4cceee4fb87" }
acorn-source = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "0607e54340f34c65370576c49cc5c4cceee4fb87" }
acorn-tar = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "0607e54340f34c65370576c49cc5c4cceee4fb87" }
acorn-zip = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "0607e54340f34c65370576c49cc5c4cceee4fb87" }
open-zipper-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "33dbeeb033fe8d8ffa69e587311677033766eb70" }

[profile.release]
lto = true
panic = "abort"
