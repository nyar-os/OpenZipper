name: check-rust

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  core-tests:
    name: core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5
      # Reads rust-toolchain.toml so CI cannot drift from the pinned channel.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo test
        run: cargo test --workspace

  gates:
    name: fmt, clippy and native addon
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: build native addon
        run: cargo build -p open-zipper-napi --release
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # This job only needs Node for stage-native.ts; do not require pnpm.
          package-manager-cache: false
      - name: stage platform package
        run: node --experimental-strip-types scripts/stage-native.ts
      - name: native addon smoke
        run: node -e "const pa = process.platform + '-' + process.arch; const m = require('./packages/open-zipper-' + pa + '/open-zipper.' + pa + '.node'); if (typeof m.capabilities !== 'function') throw new Error('capabilities export missing'); console.log(Object.keys(m).join(','))"
