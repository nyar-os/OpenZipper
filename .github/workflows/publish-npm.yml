name: publish-npm

# Trusted Publisher contract (sole npm trusted workflow — keep this filename):
#   file = publish-npm.yml
#   repo = nyar-os/OpenZipper
#   env  = NPM_PUBLISH
#
# Real `@wae/open-zipper*` versions publish only through npm Trusted Publisher
# (OIDC) on tag push. Local `nifty publish --placeholder` is only for 0.0.0 stubs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example v0.0.1). Its version is published."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: native ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build and stage the native addon
        run: node --experimental-strip-types scripts/build-napi.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: packages/open-zipper-${{ matrix.target }}/open-zipper.${{ matrix.target }}.node
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Upgrade npm for Trusted Publisher support
        run: npm install --global npm@11
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          merge-multiple: true
          path: native
      - name: Place native artifacts into platform packages
        shell: bash
        run: |
          set -euo pipefail
          for target in win32-x64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            cp "native/open-zipper.${target}.node" "packages/open-zipper-${target}/open-zipper.${target}.node"
          done
      - name: Build TypeScript and GUI
        run: pnpm run build:ts && pnpm run build:ui
      - name: Publish packages to npm
        shell: bash
        run: pnpm exec nifty publish --access public --version="${RELEASE_TAG#v}"
